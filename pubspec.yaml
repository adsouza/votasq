name: votasq
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - apps/client
  - apps/server
  - packages/shared
  - packages/google_mlkit_commons
  - packages/google_mlkit_language_id
  - packages/google_mlkit_translation

dev_dependencies:
  melos: ^7.8.0

melos:
  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    setup:
      run: |
        melos bootstrap && \
        flutter config --enable-swift-package-manager && \
        git config core.hooksPath .githooks
      description: Initialize the workspace and link packages, enable Flutter
        Swift Package Manager support, and activate the tracked git hooks under
        .githooks (e.g. pre-push runs format + analyze to mirror CI).

    gen:
      run: melos exec -- "dart run build_runner build --delete-conflicting-outputs" &&
        cd apps/client && flutter gen-l10n
      description: Generate code for all packages and regenerate l10n strings.
      packageFilters:
        dependsOn: "build_runner"

    format:
      run: |
        melos exec -c 1 --ignore="client" -- "dart format --set-exit-if-changed ." && \
        cd apps/client && dart format --set-exit-if-changed lib test tool
      description: Format Dart sources, skipping vendored SwiftPM checkouts under
        apps/client/build that have their own analysis_options.yaml. Keep this
        in sync with CI (`dart format apps packages` in .github/workflows/) —
        omitting a top-level dir here means CI catches what local format misses.

    deploy:server:
      run: >
        gcloud run deploy votasq --source . --region us-central1
        --allow-unauthenticated
      description: Manual fallback deploy of the Dart server to the `votasq`
        Cloud Run service. Normal pushes to main already auto-deploy via the
        rmgpgab-votasq-us-central1-adsouza-votasq--mavwk Cloud Build trigger
        (see cloudbuild.yaml); use this only when you need to ship without a
        commit, or when the trigger is broken.

    build:client:
      run: |
        melos exec --scope="client" -- "\
          flutter build apk    --flavor development --target lib/main_development.dart --release && \
          flutter build macos  --flavor development --target lib/main_development.dart --release && \
          flutter build ios    --flavor development --target lib/main_development.dart --release --no-codesign && \
          flutter build web                          --target lib/main_development.dart --release"
      description: Build the Flutter client (Android, macOS, iOS, Web) using
        the development flavor and entry point. Mirrors the
        flavor/target/dart-define pattern that .github/workflows/release.yaml
        uses for production. iOS builds with --no-codesign so this works on
        a dev machine without signing certs; APK needs the Android SDK
        installed locally. Web doesn't take a --flavor flag.

    release:
      run: ./tool/release.sh "$@"
      description: |
        Cut a new client release. Usage:
          RELEASE_MESSAGE='annotated tag message' \
            melos run release -- <vX.Y.Z[-suffix]>
        Pass the message via the RELEASE_MESSAGE env var, not as a positional
        arg — melos's script runner concatenates extraArgs into the command
        line without shell-quoting, so semicolons (or any shell metacharacter)
        in a positional message get reparsed by eval and truncate the tag
        annotation silently. The env var bypasses that pipeline. Runs format +
        analyze, bumps the build number in apps/client/pubspec.yaml, commits,
        pushes, and pushes an annotated tag that triggers
        .github/workflows/release.yaml. See tool/release.sh.

    # Note: `flutter run` is launched via tool/run-client.sh, not as a melos
    # script, because melos doesn't forward stdin to script processes — so
    # flutter's r/R/q hot-reload keystrokes never reach it through `melos`.
    # See tool/run-client.sh for the dev-loop entry point.
