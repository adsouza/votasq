# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
# Hand-patched to: (1) install Flutter SDK before `flutter build web`,
# (2) add a paths: filter so server-only commits don't trigger a no-op
# web rebuild, (3) align action versions with the rest of .github/workflows/.
#
# Prerequisite: firebasehosting.googleapis.com must be enabled in the GCP
# project, otherwise the deploy step fails with a misleading 403:
#   "Firebase Hosting API has not been used in project ... or it is disabled".
# Interactive `firebase deploy` from the CLI works without the API enabled
# (user OAuth routes through Firebase's consumer endpoints); service-account
# auth (what this workflow uses) goes through the standard GCP API stack
# and requires the API to be explicitly enabled.
#   gcloud services enable firebasehosting.googleapis.com --project=votasq

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - 'apps/client/**'
      - 'packages/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-merge.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: cd apps/client && flutter build web --release --target lib/main_production.dart --dart-define=SERVER_URL=
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOTASQ }}
          channelId: live
          projectId: votasq
