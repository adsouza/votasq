# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
# Hand-patched to: (1) install Flutter SDK before `flutter build web`,
# (2) add a paths: filter so server-only commits don't trigger a no-op
# web rebuild, (3) align action versions with the rest of .github/workflows/.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - 'apps/client/**'
      - 'packages/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-merge.yml'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: cd apps/client && flutter build web --release --target lib/main_production.dart --dart-define=SERVER_URL=
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOTASQ }}
          channelId: live
          projectId: votasq
