# Hand-patched to: (1) install Flutter SDK before `flutter build web`,
# (2) add a paths: filter so server-only PRs don't trigger a preview
# rebuild, (3) align action versions with the rest of .github/workflows/,
# (4) skip cleanly (instead of erroring) when the service-account secret
# is unavailable — e.g. on Dependabot PRs, which don't receive secrets.
#
# Prerequisite (same as firebase-hosting-merge.yml): the GCP project
# must have firebasehosting.googleapis.com enabled, otherwise the deploy
# step's service-account auth returns 403 with a misleading
# "API has not been used" message. Enable with:
