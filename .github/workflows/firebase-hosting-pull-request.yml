# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
# Hand-patched to: (1) install Flutter SDK before `flutter build web`,
# (2) add a paths: filter so server-only PRs don't trigger a preview
# rebuild, (3) align action versions with the rest of .github/workflows/.
#
# Prerequisite (same as firebase-hosting-merge.yml): the GCP project
# must have firebasehosting.googleapis.com enabled, otherwise the deploy
# step's service-account auth returns 403 with a misleading
# "API has not been used" message. Enable with:
#   gcloud services enable firebasehosting.googleapis.com --project=votasq

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    paths:
      - 'apps/client/**'
      - 'packages/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-pull-request.yml'
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.FIREBASE_SERVICE_ACCOUNT_VOTASQ != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: cd apps/client && flutter build web --release --target lib/main_production.dart --dart-define=SERVER_URL=
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOTASQ }}
          projectId: votasq

name: Skip Firebase deploy (no service account) 
  if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOTASQ == '' }} 
    run: echo "FIREBASE_SERVICE_ACCOUNT_VOTASQ secret missing — skipping Firebase preview deploy."
